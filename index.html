<html>
<head>
<title>Chatbot</title>
</head>

<style>

body
{
	background-color: #A7C4CE;
}

table
{
	height: 40%;
	width: 50%;
	margin: auto;
	padding: 5px;
	border-radius: 1em;
	border-spacing: 20px;
	background-color: #CEB0A7;
	box-shadow: rgba(0, 0, 0, 0.19) 0px 10px 20px, rgba(0, 0, 0, 0.23) 0px 6px 6px;
}

th
{
	font-family: Copperplate;
	font-size: 25px;
	height: 5%;
}

td
{
	height: 10%;
	font-family: Lucida Console;
	font-size: 20px;
}

.a
{
	height: 70%;
	border-radius: 10px;
	font-size: 20px;
	border: none;
	text-align: left;
	box-shadow: rgba(0, 0, 0, 0.19) 0px 10px 20px, rgba(0, 0, 0, 0.23) 0px 3px 3px;
	font-family: Courier New;
}

.container 
{
    display: flex;
    justify-content: center;
    align-items: center;
    width: 100%;
    height: 100%;
}

</style>


<body>

<div class = "container">
<table>
<tr>
<th>Chatbot</th>
</tr>

<tr>
<td>Let's have Some Interaction</td>
</tr>

<tr>
<td><input type = "text" placeholder = "Type your Question" class = "a" id = "userBox" onkeydown = "if(event.keyCode==13) {talk()}"></td>
</tr>

<tr>
<td><p id = "ChatLog">Answer Appearing Here</p></td>
</tr>

<tr>
<td></td>
</tr>

</table>
</div>

    <script type="text/javascript" src = "script.js"></script>
</body>






</html>
